<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="iRecycle 資源回收互動學習工具">
  <title>iRecycle｜資源回收互動學習</title>
  <style>
    :root { color-scheme: light; --ink: #193b35; --muted: #55706a; --accent: #2a9990; --soft: #eef8f3; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); font-family: "Microsoft JhengHei", sans-serif; background: linear-gradient(135deg, #f7fcf9, #e5f3ed); }
    main { width: min(1040px, calc(100% - 32px)); margin: 0 auto; padding: 8vh 0; }
    .hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 48px; align-items: center; }
    h1 { margin: 0 0 16px; font-size: clamp(2.5rem, 7vw, 5rem); letter-spacing: .04em; }
    .tagline { margin: 0 0 28px; color: var(--muted); font-size: clamp(1.1rem, 2vw, 1.4rem); line-height: 1.8; }
    .cards { display: grid; gap: 16px; }
    .card { display: block; padding: 24px; color: inherit; text-decoration: none; background: rgba(255,255,255,.86); border: 2px solid transparent; border-radius: 18px; box-shadow: 0 10px 30px rgba(25,59,53,.08); transition: transform .2s, border-color .2s; }
    .card:hover, .card:focus-visible { transform: translateY(-3px); border-color: var(--accent); outline: none; }
    .card h2 { margin: 0 0 8px; font-size: 1.25rem; }
    .card p { margin: 0 0 16px; color: var(--muted); line-height: 1.6; }
    .card-action { display: inline-block; padding: 11px 18px; color: #fff; background: var(--accent); border-radius: 999px; font-weight: 700; }
    .card:focus-visible { box-shadow: 0 0 0 4px rgba(42,153,144,.25), 0 10px 30px rgba(25,59,53,.08); }
    .badge { display: inline-block; margin-bottom: 20px; padding: 6px 12px; color: #fff; background: var(--accent); border-radius: 999px; font-size: .9rem; }
    .note { margin-top: 36px; color: var(--muted); font-size: .95rem; line-height: 1.7; }
    @media (max-width: 700px) { main { padding: 10vh 0 5vh; } .hero { grid-template-columns: 1fr; gap: 28px; } }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="title">
      <div>
        <span class="badge">iRecycle</span>
        <h1 id="title">一起學會<br>正確回收</h1>
        <p class="tagline">用互動遊戲認識生活中常見的垃圾分類，讓每一次選擇都更接近友善環境。</p>
      </div>
      <nav class="cards" aria-label="選擇互動內容">
        <a class="card" href="./en/index.html" aria-label="開始垃圾分類挑戰">
          <h2>垃圾分類挑戰</h2>
          <p>拖曳物品到正確分類區，立即查看說明並累積分數。</p>
          <span class="card-action">開始遊戲 →</span>
        </a>
        <a class="card" href="./game_real_layout.html" aria-label="開始場域分類遊戲">
          <h2>場域分類遊戲</h2>
          <p>在生活場景中找出對應的回收區，完成一趟分類練習。</p>
          <span class="card-action">開始遊戲 →</span>
        </a>
      </nav>
    </section>
    <p class="note">小提醒：不同地區的回收規定可能不同，實際處理前請以所在地環保單位公告為準。</p>
  </main>
</body>
</html>
